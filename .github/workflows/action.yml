name: "action"
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - v?[0-9]+.[0-9]+.[0-9]+*
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  DeterminateCI:
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@e8a6a215f4df6aaa9b239c8b3293d944ce70df21
    permissions:
      id-token: write
      contents: read
    with:
      runner-map: |
        {
          "aarch64-darwin": "macos-latest",
          "aarch64-linux": "ubuntu-24.04-arm",
          "x86_64-darwin": "macos-15",
          "x86_64-linux": "ubuntu-latest"
        }
